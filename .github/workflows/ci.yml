name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure git identity (verification scripts create temp repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: npm ci
      - run: npm run verify:local
