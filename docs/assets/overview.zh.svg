<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="ovTitle ovDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="ovTitle">fe-guard 的两层：检查层与工作流层</title>
  <desc id="ovDesc">左侧检查层编排 ESLint、TypeScript、dependency-cruiser 与四项内置检查，通过 baseline 棘轮只拦新增；右侧工作流层用 MCP 工具推进任务并留下门禁证据。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C5CFF"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#F7F8FA"/>

  <text x="48" y="54" font-size="30" font-weight="700" fill="#1F2329">fe-guard 在做两件事</text>
  <text x="48" y="82" font-size="14" fill="#6B7280">检查层守住下限，工作流层证明做完</text>

  <!-- 检查层 -->
  <rect x="48" y="112" width="540" height="430" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="72" y="136" width="112" height="32" rx="16" fill="#EFF6FF"/>
  <text x="128" y="157" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="middle">检查层</text>
  <text x="200" y="157" font-size="13" fill="#6B7280">有没有变坏</text>

  <rect x="72" y="188" width="492" height="64" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="88" y="212" font-size="13" font-weight="600" fill="#1F2329">项目已有的 ESLint / tsc / dependency-cruiser</text>
  <text x="88" y="234" font-size="12" fill="#6B7280">有配置才跑；缺工具就报未执行，不冒充通过</text>

  <rect x="72" y="264" width="492" height="64" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="88" y="288" font-size="13" font-weight="600" fill="#1F2329">依赖守卫 / 组件清单 / 腐化指标 / 大 diff</text>
  <text x="88" y="310" font-size="12" fill="#6B7280">四项内置检查；零运行时依赖</text>

  <path d="M318 328 L318 344" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="228" y="344" width="180" height="32" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="318" y="365" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">归一化违规</text>

  <path d="M318 376 L318 392" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="192" y="392" width="252" height="44" rx="12" fill="#F5F3FF" stroke="#7C5CFF"/>
  <text x="318" y="419" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">baseline 棘轮</text>

  <path d="M240 436 L192 452" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M396 436 L444 452" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="72" y="452" width="240" height="56" rx="12" fill="#FFF7ED" stroke="#F59E0B"/>
  <text x="192" y="475" font-size="13" font-weight="700" fill="#9A3412" text-anchor="middle">新增违规</text>
  <text x="192" y="496" font-size="12" fill="#9A3412" text-anchor="middle">退出码 1：拦下</text>
  <rect x="324" y="452" width="240" height="56" rx="12" fill="#ECFDF5" stroke="#10B981"/>
  <text x="444" y="475" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">存量与修复</text>
  <text x="444" y="496" font-size="12" fill="#065F46" text-anchor="middle">退出码 0：通过</text>

  <!-- 工作流层 -->
  <rect x="612" y="112" width="540" height="430" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="636" y="136" width="112" height="32" rx="16" fill="#F5F3FF"/>
  <text x="692" y="157" font-size="15" font-weight="700" fill="#4C1D95" text-anchor="middle">工作流层</text>
  <text x="764" y="157" font-size="13" fill="#6B7280">有没有做完</text>

  <rect x="648" y="184" width="468" height="42" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="664" y="210" font-size="13" fill="#1F2329"><tspan font-weight="700">task_start</tspan><tspan fill="#6B7280"> — 写目标与明确不做什么</tspan></text>
  <path d="M882 226 L882 234" stroke="#7C5CFF" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="648" y="234" width="468" height="42" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="664" y="260" font-size="13" fill="#1F2329"><tspan font-weight="700">task_criteria</tspan><tspan fill="#6B7280"> — 每条条件写 type + source</tspan></text>
  <path d="M882 276 L882 284" stroke="#7C5CFF" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="648" y="284" width="468" height="42" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="664" y="310" font-size="13" fill="#1F2329"><tspan font-weight="700">task_plan</tspan><tspan fill="#6B7280"> — 1–15 步，写完后合同锁定</tspan></text>
  <path d="M882 326 L882 334" stroke="#7C5CFF" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="648" y="334" width="468" height="42" rx="10" fill="#F5F3FF" stroke="#7C5CFF" stroke-width="1.5"/>
  <text x="664" y="360" font-size="13" fill="#1F2329"><tspan font-weight="700">task_gate</tspan><tspan fill="#6B7280"> — 真跑检查、测试、视觉命令</tspan></text>
  <path d="M882 376 L882 384" stroke="#7C5CFF" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="648" y="384" width="468" height="42" rx="10" fill="#ECFDF5" stroke="#10B981"/>
  <text x="664" y="410" font-size="13" fill="#1F2329"><tspan font-weight="700">deliver</tspan><tspan fill="#065F46"> — completion + evidence</tspan></text>

  <path d="M648 355 L592 355" stroke="#7C5CFF" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>

  <text x="648" y="456" font-size="12" fill="#6B7280">阶段由事件推导；模型不能自己把阶段标成通过。</text>
  <text x="648" y="480" font-size="12" fill="#9A3412">失败门禁后必须先 task_lesson，再交付。</text>

  <!-- 底部徽章 -->
  <rect x="48" y="568" width="120" height="32" rx="16" fill="#ECFDF5" stroke="#10B981"/>
  <text x="108" y="589" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">只拦新增</text>
  <rect x="180" y="568" width="132" height="32" rx="16" fill="#F5F3FF" stroke="#7C5CFF"/>
  <text x="246" y="589" font-size="13" font-weight="600" fill="#4C1D95" text-anchor="middle">绝不假绿灯</text>
  <rect x="324" y="568" width="132" height="32" rx="16" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="390" y="589" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">证据可审计</text>
  <text x="1152" y="589" font-size="12" fill="#9CA3AF" text-anchor="end">fe-guard 0.6</text>
</svg>
