<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="rulesTitle rulesDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="rulesTitle">fe-guard's four hard rules</title>
  <desc id="rulesDesc">Four rules: freeze existing debt and block only new violations; not run is not passed; evidence instead of claims; a failed gate requires a lesson. Each card explains why.</desc>
  <rect width="1200" height="420" fill="#F7F8FA"/>
  <text x="48" y="54" font-size="30" font-weight="700" fill="#1F2329">Four hard rules</text>
  <text x="48" y="82" font-size="14" fill="#6B7280">Not suggestions — decisions in code</text>

  <!-- Card 1 -->
  <g>
    <rect x="48" y="116" width="264" height="220" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="48" y="116" width="264" height="6" rx="3" fill="#3B82F6"/>
    <circle cx="76" cy="148" r="14" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="76" y="153" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">1</text>
    <text x="100" y="154" font-size="16" font-weight="700" fill="#1F2329">Freeze first, block new</text>
    <text x="68" y="188" font-size="12" fill="#4B5563">baseline records existing debt</text>
    <text x="68" y="210" font-size="12" fill="#4B5563">check blocks only what exceeds it</text>
    <text x="68" y="232" font-size="12" fill="#4B5563">fixing old issues tightens it</text>
    <rect x="64" y="258" width="232" height="58" rx="8" fill="#EFF6FF"/>
    <text x="76" y="278" font-size="10.5" fill="#1D4ED8">Why:</text>
    <text x="76" y="296" font-size="10.5" fill="#1D4ED8">a full lint turns red on day one,</text>
    <text x="76" y="311" font-size="10.5" fill="#1D4ED8">so the team turns the check off</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="344" y="116" width="264" height="220" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="344" y="116" width="264" height="6" rx="3" fill="#F59E0B"/>
    <circle cx="372" cy="148" r="14" fill="#FFF7ED" stroke="#F59E0B"/>
    <text x="372" y="153" font-size="13" font-weight="700" fill="#9A3412" text-anchor="middle">2</text>
    <text x="396" y="154" font-size="16" font-weight="700" fill="#1F2329">Not run ≠ passed</text>
    <text x="364" y="188" font-size="12" fill="#4B5563">missing tool / timeout / crash</text>
    <text x="364" y="210" font-size="12" fill="#4B5563">record not-executed, never in baseline</text>
    <text x="364" y="232" font-size="12" fill="#4B5563">skipped is not passed either</text>
    <rect x="360" y="258" width="232" height="58" rx="8" fill="#FFF7ED"/>
    <text x="372" y="278" font-size="10.5" fill="#9A3412">Why:</text>
    <text x="372" y="296" font-size="10.5" fill="#9A3412">a false green is more dangerous</text>
    <text x="372" y="311" font-size="10.5" fill="#9A3412">than a red build</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="640" y="116" width="264" height="220" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="640" y="116" width="264" height="6" rx="3" fill="#7C5CFF"/>
    <circle cx="668" cy="148" r="14" fill="#F5F3FF" stroke="#7C5CFF"/>
    <text x="668" y="153" font-size="13" font-weight="700" fill="#4C1D95" text-anchor="middle">3</text>
    <text x="692" y="154" font-size="16" font-weight="700" fill="#1F2329">Evidence, not claims</text>
    <text x="660" y="188" font-size="12" fill="#4B5563">every gate writes a snapshot</text>
    <text x="660" y="210" font-size="12" fill="#4B5563">manual evidence: bytes + sha256</text>
    <text x="660" y="232" font-size="12" fill="#4B5563">visual criteria need visualDiff.ok</text>
    <rect x="656" y="258" width="232" height="58" rx="8" fill="#F5F3FF"/>
    <text x="668" y="278" font-size="10.5" fill="#4C1D95">Why:</text>
    <text x="668" y="296" font-size="10.5" fill="#4C1D95">saying "done" costs nothing;</text>
    <text x="668" y="311" font-size="10.5" fill="#4C1D95">evidence requires a real run</text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="936" y="116" width="264" height="220" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="936" y="116" width="264" height="6" rx="3" fill="#10B981"/>
    <circle cx="964" cy="148" r="14" fill="#ECFDF5" stroke="#10B981"/>
    <text x="964" y="153" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">4</text>
    <text x="988" y="154" font-size="16" font-weight="700" fill="#1F2329">Fail, then reflect</text>
    <text x="956" y="188" font-size="12" fill="#4B5563">task_lesson after a failed gate</text>
    <text x="956" y="210" font-size="12" fill="#4B5563">delivery reports N done / M deferred</text>
    <text x="956" y="232" font-size="12" fill="#4B5563">degraded must be explicit</text>
    <rect x="952" y="258" width="232" height="58" rx="8" fill="#ECFDF5"/>
    <text x="964" y="278" font-size="10.5" fill="#065F46">Why:</text>
    <text x="964" y="296" font-size="10.5" fill="#065F46">without a lesson the same trap</text>
    <text x="964" y="311" font-size="10.5" fill="#065F46">repeats, and looks new every time</text>
  </g>

  <rect x="48" y="356" width="1104" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="600" y="381" font-size="14" font-weight="600" fill="#4B5563" text-anchor="middle">Skipped ≠ passed · not run ≠ fine</text>
  <text x="1152" y="411" font-size="11" fill="#9CA3AF" text-anchor="end">fe-guard 0.6</text>
</svg>
